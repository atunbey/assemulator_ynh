server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Merge standard MIME types first, then add application/wasm for .wasm files.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Required when COEP (Cross-Origin-Embedder-Policy: require-corp) is active
    # (e.g. set by a YunoHost security profile).  Without this header Chrome
    # blocks subresources and reports them as CORB violations.
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # SPA fallback: unknown paths serve index.html so Blazor router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve user data directories directly without SPA fallback
    location /data/  { try_files $uri =404; }
    location /roms/  { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location /bios/  { try_files $uri =404; }

    # Disable caching for the Blazor bootstrap files so updates are picked up
    location ~* \.(json|wasm|dll|dat)$ {
        add_header Cache-Control "no-cache";
    }

    # Serve the NextCloud API
    location /assemulator/nc-api/ {
        proxy_pass https://tools.kushkurriculum.org/nextcloud/;
        proxy_set_header Host tools.kushkurriculum.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_redirect http://127.0.0.1/ /;
        proxy_redirect https://tools.kushkurriculum.org/nextcloud/ /nc-api/;
        proxy_cookie_flags ~ nosecure;
    }
}
