location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300;
    proxy_connect_timeout 60;

    # Blazor WebAssembly requires unsafe-eval (Mono/.NET WASM runtime) and
    # unsafe-inline (MudBlazor injects styles at runtime).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self';" always;

    # Required for sub_filter to scan upstream HTML for base href rewriting.
    proxy_set_header Accept-Encoding "";
    sub_filter '<base href="/" />' '<base href="__PATH__/" />';
    sub_filter_once on;
}

# Nextcloud API proxy (no SSO, custom headers)
location /nc-api/ {
    proxy_pass https://tools.kushkurriculum.org/nextcloud/;
    proxy_set_header Host tools.kushkurriculum.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    proxy_redirect http://127.0.0.1/ /;
    proxy_redirect https://tools.kushkurriculum.org/nextcloud/ /nc-api/;
    proxy_cookie_flags ~ nosecure;
    # SSO must be disabled for this path!
    sso_enabled off;
}
